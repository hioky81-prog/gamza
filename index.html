    async function fetchUserProfile(userId) {
      if (!supabaseClient || !userId) return null;
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', userId)
          .maybeSingle();
        if (!error && data) return data;
      } catch (e) {
        console.error("프로필 조회 예외:", e);
      }
      return null;
    }

    async function ensureUserProfile(user, preferredNickname = "") {
      if (!supabaseClient || !user) return null;
      const nick = preferredNickname || user.user_metadata?.nickname || (user.email ? user.email.split('@')[0] : '감자이웃');
      try {
        const { data, error } = await supabaseClient
          .from('profiles')
          .upsert({
            id: user.id,
            nickname: nick,
            verified_location: '역삼1동',
            manner_temperature: 36.5
          })
          .select()
          .maybeSingle();
        if (!error && data) return data;
      } catch (e) {
        console.error("프로필 보장 생성 에러:", e);
      }
      return { id: user.id, nickname: nick, verified_location: '역삼1동', manner_temperature: 36.5 };
    }

    function updateAuthUI(user, profile) {
      currentUser = user;
      currentUserProfile = profile;
      const guestGroup = document.getElementById("guestActionGroup");
      const userGroup = document.getElementById("userActionGroup");
      const nicknameText = document.getElementById("headerUserNickname");

      if (user) {
        if (guestGroup) guestGroup.style.display = "none";
        if (userGroup) userGroup.style.display = "flex";
        const displayName = profile?.nickname || user.user_metadata?.nickname || (user.email ? user.email.split('@')[0] : '감자이웃');
        if (nicknameText) nicknameText.textContent = displayName;
      } else {
        if (guestGroup) guestGroup.style.display = "flex";
        if (userGroup) userGroup.style.display = "none";
        if (nicknameText) nicknameText.textContent = "";
      }
    }

    function openAuthModal(mode = 'login') {
      switchAuthMode(mode);
      const errBox = document.getElementById("authErrorMessage");
      if (errBox) errBox.style.display = "none";
      const overlay = document.getElementById("authModalOverlay");
      if (overlay) overlay.classList.add("active");
      document.body.style.overflow = "hidden";
      setTimeout(() => {
        const targetInput = mode === 'signup' 
          ? document.getElementById("authNicknameInput") 
          : document.getElementById("authEmailInput");
        if (targetInput) targetInput.focus();
      }, 100);
    }

    function closeAuthModal() {
      const overlay = document.getElementById("authModalOverlay");
      if (overlay) overlay.classList.remove("active");
      document.body.style.overflow = "";
      const form = document.getElementById("authForm");
      if (form) form.reset();
      const errBox = document.getElementById("authErrorMessage");
      if (errBox) errBox.style.display = "none";
    }

    function handleAuthOverlayClick(event) {
      if (event.target === document.getElementById("authModalOverlay")) {
        closeAuthModal();
      }
    }

    function switchAuthMode(mode) {
      currentAuthMode = mode;
      const tabLogin = document.getElementById("tabBtnLogin");
      const tabSignup = document.getElementById("tabBtnSignup");
      const groupNick = document.getElementById("groupSignupNickname");
      const nickInput = document.getElementById("authNicknameInput");
      const title = document.getElementById("authModalTitle");
      const subtitle = document.getElementById("authModalSubtitle");
      const submitBtn = document.getElementById("btnAuthSubmit");
      const switchText = document.getElementById("authSwitchText");
      const switchLink = document.getElementById("authSwitchLink");
      const errBox = document.getElementById("authErrorMessage");
      if (errBox) errBox.style.display = "none";

      if (mode === 'signup') {
        if (tabLogin) tabLogin.classList.remove("active");
        if (tabSignup) tabSignup.classList.add("active");
        if (groupNick) groupNick.style.display = "flex";
        if (nickInput) nickInput.required = true;
        if (title) title.textContent = "감자마을 회원가입";
        if (subtitle) subtitle.textContent = "닉네임과 이메일로 간편하게 가입하세요";
        if (submitBtn) submitBtn.textContent = "가입하고 시작하기";
        if (switchText) switchText.textContent = "이미 감자 계정이 있으신가요?";
        if (switchLink) switchLink.textContent = "로그인";
      } else {
        if (tabLogin) tabLogin.classList.add("active");
        if (tabSignup) tabSignup.classList.remove("active");
        if (groupNick) groupNick.style.display = "none";
        if (nickInput) { nickInput.required = false; nickInput.value = ""; }
        if (title) title.textContent = "감자마을 로그인";
        if (subtitle) subtitle.textContent = "우리 동네 따뜻한 중고거래를 시작해보세요";
        if (submitBtn) submitBtn.textContent = "로그인하기";
        if (switchText) switchText.textContent = "아직 감자 계정이 없으신가요?";
        if (switchLink) switchLink.textContent = "회원가입";
      }
    }

    function toggleAuthMode() {
      switchAuthMode(currentAuthMode === 'login' ? 'signup' : 'login');
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      if (!supabaseClient) {
        showToast("⚠️ Supabase가 연결되지 않았습니다.");
        return;
      }

      const email = document.getElementById("authEmailInput").value.trim();
      const password = document.getElementById("authPasswordInput").value.trim();
      const nicknameInput = document.getElementById("authNicknameInput");
      const nickname = nicknameInput ? nicknameInput.value.trim() : "";
      const submitBtn = document.getElementById("btnAuthSubmit");
      const errBox = document.getElementById("authErrorMessage");
      if (errBox) errBox.style.display = "none";

      if (currentAuthMode === 'signup' && !nickname) {
        if (errBox) {
          errBox.textContent = "닉네임을 필수로 입력해주세요!";
          errBox.style.display = "block";
        }
        return;
      }

      const originalBtnText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = currentAuthMode === 'signup' ? "가입 처리 중..." : "로그인 중...";

      try {
        if (currentAuthMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { nickname }
            }
          });

          if (error) throw error;

          const user = data?.user;
          if (user) {
            const profile = await ensureUserProfile(user, nickname);
            if (!data.session) {
              // 이메일 확인 설정 등의 경우 대비 자동 로그인 시도
              const autoLogin = await supabaseClient.auth.signInWithPassword({ email, password });
              if (autoLogin.data?.session) {
                updateAuthUI(autoLogin.data.user, profile);
                showToast(`🎉 환영합니다, ${nickname}님!`);
                closeAuthModal();
                checkPendingActionAfterAuth();
                return;
              } else {
                showToast("✉️ 가입 환영 메일을 확인하신 후 로그인해주세요!");
                switchAuthMode('login');
                return;
              }
            } else {
              updateAuthUI(user, profile);
              showToast(`🎉 감자마을 가입을 환영합니다, ${nickname}님!`);
              closeAuthModal();
              checkPendingActionAfterAuth();
              return;
            }
          }
          showToast("🎉 회원가입 완료! 로그인해주세요.");
          switchAuthMode('login');
        } else {
          // 로그인 모드
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          const user = data.user;
          let profile = await fetchUserProfile(user.id);
          if (!profile) {
            profile = await ensureUserProfile(user);
          }
          updateAuthUI(user, profile);
          const displayName = profile?.nickname || user.user_metadata?.nickname || "감자이웃";
          showToast(`👋 어서오세요, ${displayName}님!`);
          closeAuthModal();
          checkPendingActionAfterAuth();
        }
      } catch (err) {
        console.error("인증 에러:", err);
        if (errBox) {
          let msg = err.message || "오류가 발생했습니다.";
          if (msg.includes("Invalid login credentials")) msg = "이메일 또는 비밀번호가 올바르지 않습니다.";
          else if (msg.includes("User already registered")) msg = "이미 가입된 이메일 주소입니다. 로그인해주세요.";
          else if (msg.includes("Password should be at least")) msg = "비밀번호는 최소 6자 이상이어야 합니다.";
          errBox.textContent = msg;
          errBox.style.display = "block";
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
      }
    }

    function checkPendingActionAfterAuth() {
      if (pendingActionAfterLogin === 'openWriteModal') {
        pendingActionAfterLogin = null;
        setTimeout(() => {
          openWriteModal();
        }, 200);
      }
    }

    async function handleLogout() {
      if (!supabaseClient) return;
      try {
        await supabaseClient.auth.signOut();
        updateAuthUI(null, null);
        showToast("👋 안전하게 로그아웃되었습니다.");
      } catch (e) {
        console.error("로그아웃 실패:", e);
      }
    }

    // [글쓰기] 버튼 클릭 인터셉터 (비로그인 시 로그인 모달 유도)
    function handleWriteButtonClick() {
      if (currentUser) {
        openWriteModal();
      } else {
        pendingActionAfterLogin = 'openWriteModal';
        showToast("🔒 글쓰기는 로그인 후 이용할 수 있어요.");
        openAuthModal('login');
      }
    }

    async function initAuth() {
      if (!supabaseClient) return;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          let profile = await fetchUserProfile(session.user.id);
          if (!profile) profile = await ensureUserProfile(session.user);
          updateAuthUI(session.user, profile);
        }

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') && session?.user) {
            let profile = await fetchUserProfile(session.user.id);
            if (!profile) profile = await ensureUserProfile(session.user);
            updateAuthUI(session.user, profile);
          } else if (event === 'SIGNED_OUT') {
            updateAuthUI(null, null);
          }
        });
      } catch (e) {
        console.error("세션 초기화 실패:", e);
      }
    }

    // ---------------------------------------------------------
    // D. [화면 2] 상세 팝업 모달 인터랙션 & 조회수/찜 동기화
    // ---------------------------------------------------------
    async function openDetailModal(productId) {
      const item = productList.find(p => String(p.id) === String(productId));
      if (!item) return;

      activeDetailProduct = item;

      // Supabase 조회수 카운트 1 증가
      if (supabaseClient) {
        supabaseClient
          .from('products')
          .update({ view_count: (item.views || 0) + 1 })
          .eq('id', item.id)
          .then();
        item.views = (item.views || 0) + 1;
      }

      document.getElementById("detailHeroImage").src = item.image;
      document.getElementById("detailTitle").textContent = item.title;
      document.getElementById("detailLocation").textContent = item.location;
      document.getElementById("detailTimeAgo").textContent = item.timeAgo;
      document.getElementById("detailCategoryTag").textContent = item.category;

      const priceText = item.price === 0 ? "무료 나눔 🥔" : `${Number(item.price).toLocaleString()}원`;
      document.getElementById("detailPrice").textContent = priceText;

      const statusBadge = document.getElementById("detailStatusBadge");
      statusBadge.textContent = item.status;
      statusBadge.className = "detail-status-pill " + (
        item.status === "판매중" ? "status-selling" : item.status === "예약중" ? "status-reserved" : "status-sold"
      );

      // 판매자 정보 및 SEED 매너온도 계산
      const seller = item.seller || {
        name: "포슬포슬감자",
        location: item.location,
        avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
        temp: 36.5
      };

      document.getElementById("detailSellerName").textContent = seller.name;
      document.getElementById("detailSellerLocation").textContent = seller.location;
      document.getElementById("detailSellerAvatar").src = seller.avatar;

      // 매너온도 레벨별 색상/이모지 연동 (SEED Manner Temp 스펙)
      const tempVal = Number(seller.temp) || 36.5;
      const tempElem = document.getElementById("detailSellerTemp");
      const emojiElem = document.getElementById("detailSellerEmoji");
      const fillElem = document.getElementById("detailSellerTempFill");

      tempElem.textContent = `${tempVal}℃`;
      fillElem.style.width = `${Math.min(Math.max((tempVal / 100) * 100, 10), 100)}%`;

      if (tempVal >= 50.0) {
        tempElem.className = "manner-temp-value temp-level-red";
        fillElem.className = "manner-temp-fill temp-fill-red";
        emojiElem.textContent = "😎";
      } else if (tempVal >= 40.0) {
        tempElem.className = "manner-temp-value temp-level-orange";
        fillElem.className = "manner-temp-fill temp-fill-orange";
        emojiElem.textContent = "😄";
      } else {
        tempElem.className = "manner-temp-value temp-level-blue";
        fillElem.className = "manner-temp-fill temp-fill-blue";
        emojiElem.textContent = "😊";
      }

      document.getElementById("detailDescription").textContent = item.description;

      const heartBtn = document.getElementById("btnHeartInterest");
      const isLiked = myLikedProductIds.has(String(item.id));
      if (heartBtn) {
        if (isLiked) {
          heartBtn.classList.add("active");
        } else {
          heartBtn.classList.remove("active");
        }
      }

      // 작성자 여부 판단 및 UI 전환
      const isOwner = isCurrentUserProductOwner(item);
      const ownerBox = document.getElementById("ownerStatusBox");
      const ownerFooter = document.getElementById("ownerActionsFooter");
      const buyerFooter = document.getElementById("buyerActionsFooter");

      if (ownerBox) ownerBox.style.display = isOwner ? "flex" : "none";
      if (ownerFooter) ownerFooter.style.display = isOwner ? "flex" : "none";
      if (buyerFooter) buyerFooter.style.display = isOwner ? "none" : "flex";

      updateDetailStatusButtons(item.status);

      const overlay = document.getElementById("detailModalOverlay");
      overlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    // 작성자 본인 확인 헬퍼
    function isCurrentUserProductOwner(product) {
      if (!product) return false;
      const productSellerId = String(product.seller_id || product.seller?.id || '');
      if (!productSellerId) return false;

      // 1) 로그인된 회원인 경우
      if (currentUser && String(currentUser.id) === productSellerId) {
        return true;
      }

      // 2) 비로그인/익명 작성자인 경우
      const anonId = localStorage.getItem("gamza_anon_user_id");
      if (!currentUser && anonId && String(anonId) === productSellerId) {
        return true;
      }

      return false;
    }

    // 상세 모달 내 상태 변경 버튼 active 클래스 갱신
    function updateDetailStatusButtons(status) {
      const norm = (status || "").replace(/\s+/g, "");
      const btnSelling = document.getElementById("optBtnSelling");
      const btnReserved = document.getElementById("optBtnReserved");
      const btnSold = document.getElementById("optBtnSold");

      if (btnSelling) btnSelling.classList.toggle("active", norm === "판매중");
      if (btnReserved) btnReserved.classList.toggle("active", norm === "예약중");
      if (btnSold) btnSold.classList.toggle("active", norm === "거래완료");
    }

    // 빠른 상태 변경 (판매중 / 예약중 / 거래 완료)
    async function handleQuickStatusChange(newStatus) {
      if (!activeDetailProduct) return;
      const productId = activeDetailProduct.id;

      activeDetailProduct.status = newStatus;

      // 로컬 목록 동기화
      const localItem = productList.find(p => String(p.id) === String(productId));
      if (localItem) {
        localItem.status = newStatus;
      }

      // 상세 모달 상태 배지 즉시 갱신
      const statusBadge = document.getElementById("detailStatusBadge");
      if (statusBadge) {
        statusBadge.textContent = newStatus;
        const norm = newStatus.replace(/\s+/g, "");
        statusBadge.className = "detail-status-pill " + (
          norm === "판매중" ? "status-selling" : (norm === "예약중" ? "status-reserved" : "status-sold")
        );
      }

      // 상세 모달 버튼 active 상태 갱신
      updateDetailStatusButtons(newStatus);

      // 목록 카드 렌더링 (상태 배지 및 흐리게 표시 동기화)
      renderProducts();

      // Supabase DB 상태 업데이트
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('products')
            .update({ status: newStatus, updated_at: new Date().toISOString() })
            .eq('id', productId);

          if (error) {
            console.error("Supabase 상태 업데이트 실패:", error);
            showToast(`⚠️ DB 저장 실패: ${error.message}`);
            return;
          }
        } catch (err) {
          console.error("상태 업데이트 통신 예외:", err);
        }
      }

      showToast(`🥔 상태가 '${newStatus}'(으)로 변경 및 저장되었습니다.`);
    }

    // 게시글 삭제 처리
    async function handleDeleteProduct(productId) {
      if (!productId) return;
      const confirmDelete = confirm("정말 이 게시글을 삭제하시겠습니까?\n삭제된 글은 복구할 수 없습니다.");
      if (!confirmDelete) return;

      showToast("⏳ 게시글을 삭제하고 있습니다...");

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('products')
            .delete()
            .eq('id', productId);

          if (error) {
            console.error("Supabase 삭제 실패:", error);
            showToast(`❌ 삭제 실패: ${error.message}`);
            return;
          }
        } catch (err) {
          console.error("게시글 삭제 예외:", err);
        }
      }

      // 로컬 목록에서 제거
      productList = productList.filter(p => String(p.id) !== String(productId));
      closeDetailModal();
      renderProducts();
      showToast("🗑️ 게시글이 성공적으로 삭제되었습니다.");
    }

    // 게시글 수정 모달 열기
    function openEditModal(productId) {
      const item = productList.find(p => String(p.id) === String(productId));
      if (!item) return;

      editingProductId = productId;

      // 모달 제목 및 버튼 변경

      if (submitBtn) submitBtn.textContent = "수정 완료";

      const inputTitle = document.getElementById("inputTitle");
      const selectCategory = document.getElementById("selectCategory");
      const inputPrice = document.getElementById("inputPrice");
      const inputLocation = document.getElementById("inputLocation");
      const textareaDescription = document.getElementById("textareaDescription");
      const inputImageUrl = document.getElementById("inputImageUrl");
      const descCount = document.getElementById("indexDescCharCount");

      if (inputTitle) inputTitle.value = item.title || "";
      if (selectCategory) selectCategory.value = item.category || "";
      if (inputPrice) inputPrice.value = (item.price !== undefined) ? item.price : "";
      if (inputLocation) inputLocation.value = item.location || "";
      if (textareaDescription) {
        textareaDescription.value = item.description || "";
        if (descCount) descCount.textContent = `${(item.description || "").length}/500`;
      }

        inputImageUrl.value = (item.image && !item.image.startsWith("data:")) ? item.image : "";
      }
      handleImageUrlInput(item.image || "");

      const norm = (item.status || "판매중").replace(/\s+/g, "");
      const targetVal = norm === "예약중" ? "예약중" : (norm === "거래완료" ? "거래 완료" : "판매중");
      const radio = document.querySelector(`input[name="productStatus"][value="${targetVal}"]`);
      if (radio) radio.checked = true;

      // 상세 팝업 닫고 글쓰기/수정 모달 띄우기

      if (overlay) overlay.classList.remove("active");
      document.body.style.overflow = "";
      activeDetailProduct = null;
    }

    function handleDetailOverlayClick(event) {
      if (event.target === document.getElementById("detailModalOverlay")) {
        closeDetailModal();
      }
    }

    async function toggleInterest() {
      if (!activeDetailProduct) return;
      const heartBtn = document.getElementById("btnHeartInterest");
      const isLiked = heartBtn.classList.toggle("active");
      const productId = activeDetailProduct.id;
      const strId = String(productId);

      if (isLiked) {
        myLikedProductIds.add(strId);
        activeDetailProduct.likes = (activeDetailProduct.likes || 0) + 1;
      } else {
        myLikedProductIds.delete(strId);
        activeDetailProduct.likes = Math.max(0, (activeDetailProduct.likes || 1) - 1);
      }

      renderProducts();
      showToast(isLiked ? "❤️ 관심 목록에 추가되었습니다!" : "🤍 관심 목록에서 제거되었습니다.");

      // Supabase product_likes 및 like_count 업데이트
      if (supabaseClient) {
        try {
          const userId = await getOrCreateAnonymousUser();
          if (isLiked) {
            await supabaseClient.from('product_likes').insert([{ product_id: productId, user_id: userId }]);
          } else {
            await supabaseClient.from('product_likes').delete().eq('product_id', productId).eq('user_id', userId);
          }
          await supabaseClient.from('products').update({ like_count: activeDetailProduct.likes }).eq('id', productId);
        } catch (e) {
          console.error("관심 정보 Supabase 동기화 오류:", e);
        }
      }
    }

    async function startChatPlaceholder() {
      if (!activeDetailProduct) return;
      const sellerName = activeDetailProduct.seller?.name || '판매자';
      showToast(`💬 '${sellerName}'님과의 채팅방을 생성하는 중...`);

      if (supabaseClient && activeDetailProduct.seller?.id) {
        try {
          const buyerId = await getOrCreateAnonymousUser();
          await supabaseClient.from('chat_rooms').insert([{
            product_id: activeDetailProduct.id,
            buyer_id: buyerId,
            seller_id: activeDetailProduct.seller.id,
            last_message: '거래 문의가 시작되었습니다.'
          }]);
          // chat_count 증가
          await supabaseClient.from('products').update({ chat_count: (activeDetailProduct.chats || 0) + 1 }).eq('id', activeDetailProduct.id);
          activeDetailProduct.chats = (activeDetailProduct.chats || 0) + 1;
          renderProducts();
          showToast(`💬 '${sellerName}'님과의 채팅방이 개설되었습니다!`);
        } catch (e) {
          console.error("채팅방 생성 에러:", e);
        }
      } else {
        showToast(`💬 '${sellerName}'님과의 채팅방이 곧 준비됩니다!`);
      }
    }

    // ---------------------------------------------------------
    // E. [화면 3] 글쓰기 모달 폼 & Supabase INSERT 연동
    // ---------------------------------------------------------
    function openWriteModal() {
      // 신규 등록 모드인 경우 폼 초기화
      if (!editingProductId) {
        const heading = document.getElementById("writeModalHeading");

        if (submitBtn) submitBtn.textContent = "작성 완료";
        const form = document.getElementById("writeProductForm");
        if (form) form.reset();
        handleImageUrlInput("");
        const descCount = document.getElementById("indexDescCharCount");
        if (descCount) descCount.textContent = "0/500";
      }

      const overlay = document.getElementById("writeModalOverlay");
      if (overlay) overlay.classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeWriteModal() {
      const overlay = document.getElementById("writeModalOverlay");
      if (overlay) overlay.classList.remove("active");
      document.body.style.overflow = "";
      editingProductId = null; // 수정 모드 초기화
    }

    function handleWriteOverlayClick(event) {
      if (event.target === document.getElementById("writeModalOverlay")) {
        closeWriteModal();
      }
    }

    function handleImageUrlInput(url) {
      const previewImg = document.getElementById("writePreviewImg");
      const icon = document.getElementById("previewPlaceholderIcon");
      if (!previewImg || !icon) return;
      if (url && url.trim()) {
        previewImg.src = url;
        previewImg.style.display = "block";
        icon.style.display = "none";
      } else {
        previewImg.style.display = "none";
        icon.style.display = "block";
      }
    }

    function handleFileInput(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        handleImageUrlInput(evt.target.result);
      };
      reader.readAsDataURL(file);
    }

    async function handleProductSubmit(event) {
      event.preventDefault();

      const title = document.getElementById("inputTitle").value.trim();
      const category = document.getElementById("selectCategory").value;
      const price = parseInt(document.getElementById("inputPrice").value, 10) || 0;
      const location = document.getElementById("inputLocation").value.trim();
      const description = document.getElementById("textareaDescription").value.trim();

      const statusRadio = document.querySelector('input[name="productStatus"]:checked');
      const status = statusRadio ? statusRadio.value : "판매중";

      let image = document.getElementById("inputImageUrl").value.trim();
      const previewImg = document.getElementById("writePreviewImg");
      if (!image && previewImg && previewImg.style.display === "block" && previewImg.src) {
        image = previewImg.src;
      }
      if (!image) {
        image = "https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=800&q=80";
      }

      if (description.length > 500) {
        showToast("⚠️ 자세한 설명은 최대 500자까지 작성할 수 있습니다.");
        return;
      }

      // [수정 모드 분기]
      if (editingProductId) {
        showToast("⏳ 수파베이스에 수정 내용을 저장하고 있어요...");

        const updatePayload = {
          title,
          category,
          price,
          location,
          status,
          image_url: image,
          description,
          is_free_share: price === 0,
          updated_at: new Date().toISOString()
        };

        if (supabaseClient) {
          try {
            const { error } = await supabaseClient
              .from('products')
              .update(updatePayload)
              .eq('id', editingProductId);

            if (error) {
              console.error("Supabase 수정 실패:", error);
              showToast(`❌ 수정 실패: ${error.message}`);
              return;
            }
          } catch (err) {
            console.error("수정 통신 예외:", err);
          }
        }

        // 로컬 productList 갱신
        const localItem = productList.find(p => String(p.id) === String(editingProductId));
        if (localItem) {
          localItem.title = title;
          localItem.category = category;
          localItem.price = price;
          localItem.location = location;
          localItem.status = status;
          localItem.image = image;
          localItem.description = description;
        }

        const finishedId = editingProductId;
        closeWriteModal();
        renderProducts();
        openDetailModal(finishedId); // 수정된 상세 화면 즉시 다시 오픈
        showToast(`🎉 게시글이 성공적으로 수정되었습니다!`);
        return;
      }

      showToast("⏳ 수파베이스에 새 상품을 저장하고 있어요...");

      // 로그인 사용자가 있으면 currentUser.id, 없으면 로컬 익명 ID 사용
      let sellerId = currentUser ? currentUser.id : await getOrCreateAnonymousUser();
      if (currentUser && !currentUserProfile) {
        currentUserProfile = await fetchUserProfile(currentUser.id) || await ensureUserProfile(currentUser);
      }

      const insertPayload = {
        seller_id: sellerId,
        title,
        category,
        price,
        location,
        status,
        image_url: image,
        description,
        is_free_share: price === 0,
        is_negotiable: false
      };

      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('products')
            .insert([insertPayload])
            .select();

          if (error) {
            console.error("Supabase 등록 실패:", error);
            showToast(`❌ 등록 실패: ${error.message}`);
            return;
          }

          showToast(`🎉 '${title.substring(0, 14)}...' 상품이 수파베이스에 안전하게 등록되었습니다!`);
          
          // 폼 리셋 및 닫기
          document.getElementById("writeProductForm").reset();
          const indexDescCount = document.getElementById("indexDescCharCount");
          if (indexDescCount) indexDescCount.textContent = "0/500";
          handleImageUrlInput("");
          closeWriteModal();

          // 최신 목록 다시 로드
          await loadProductsFromSupabase();
          return;
        } catch (err) {
          console.error("등록 중 예외 발생:", err);
        }
      }

      // 오프라인 폴백 처리
      const newProduct = {
        id: Date.now(),
        title,
        category,
        price,
        location,
        timeAgo: "방금 전",
        status,
        image,
        description,
        likes: 0,
        chats: 0,
        seller: {
          id: sellerId,
          name: currentUserProfile?.nickname || (currentUser?.email ? currentUser.email.split('@')[0] : "포슬포슬감자"),
          location,
          avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
          temp: 36.5
        }
      };

      productList.unshift(newProduct);
      renderProducts();
      document.getElementById("writeProductForm").reset();
      handleImageUrlInput("");
      closeWriteModal();
      showToast(`🎉 상품이 로컬에 등록되었습니다!`);
    }

    // ---------------------------------------------------------
    // F. SEED Snackbar (토스트 알림 유틸리티)
    // ---------------------------------------------------------
    let toastTimer = null;
    function showToast(message) {
      const toast = document.getElementById("gamzaToast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeDetailModal();
        closeWriteModal();
        closeAuthModal();
      }
    });

    // ---------------------------------------------------------
    // G. 초기화 실행 (즉시 동기 렌더링 + 비동기 Supabase 동기화)
    // ---------------------------------------------------------
    function initGamzaApp() {
      initAuth(); // 세션 복원 및 인증 상태 리스너 가동
      initCategoryTabs();
      renderProducts(); // 즉시 폴백 데이터로 렌더링 (0ms 로딩)
      loadMyLikes();
      loadProductsFromSupabase(); // Supabase 비동기 최신화
      setupRealtime();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initGamzaApp);
    } else {
      initGamzaApp();
    }
  </script>

</body>
</html>
